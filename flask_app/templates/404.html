{% extends "base.html" %}

{% block content %}
<section class="min-h-screen flex items-center justify-center">
    <div class="absolute inset-0 bg-gradient-to-br from-purple-900 via-slate-900 to-indigo-900"></div>
    
    <div class="relative z-10 text-center px-4 max-w-2xl mx-auto">
        <div class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl p-12 shadow-2xl">
            <div class="text-8xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent mb-6">
                404
            </div>
            <h1 class="text-3xl md:text-4xl font-light mb-4 text-white">
                Page Not Found
            </h1>
            <p class="text-white/60 mb-8">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="{{ url_for('home') }}" 
               class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-amber-500 to-orange-600 text-white font-semibold rounded-full hover:shadow-lg hover:shadow-amber-500/25 transition-all duration-300">
                <i data-lucide="home" class="mr-2 w-5 h-5"></i>
                Back to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        lucide.createIcons();
    });
</script>
{% endblock %}
